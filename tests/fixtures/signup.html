<!doctype html><html><head><meta charset=utf-8><title>Northwind · Create account</title><style>
*{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;background:#f3f4f6;color:#111827}
nav{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 48px;gap:10px;font-weight:600}
nav i{width:26px;height:26px;border-radius:7px;background:#0f766e;display:inline-block}
.card{width:400px;margin:72px auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:32px}
h1{font-size:22px;margin:0 0 4px} p.s{margin:0 0 24px;color:#6b7280}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
input{display:block;width:100%;height:40px;border:1px solid #d1d5db;border-radius:8px;padding:0 12px;font:inherit;margin-bottom:16px}
input:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.15)}
button{width:100%;height:42px;border:0;border-radius:8px;background:#0f766e;color:#fff;font:inherit;font-weight:600;margin-top:4px}
</style></head><body>
<nav><i></i>Northwind</nav><div class=card><h1>Create your account</h1><p class=s>Start your free Northwind trial.</p>
<form id=f onsubmit="event.preventDefault();document.getElementById('out').textContent='submitted'">
<label for=user>Username</label><input id=user name=username>
<label for=pass>Password</label><input id=pass type=password name=password>
<label for=confirm>Confirm password</label><input id=confirm type=password name=confirm_password>
<button type=submit>Create account</button></form><p id=out></p></div></body></html>
